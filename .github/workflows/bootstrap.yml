name: Bootstrap repository source



on:

  push:
  
    paths:
    
      - algocracy-source.zip
      
      - .github/workflows/bootstrap.yml
      
  workflow_dispatch:
  


permissions:

  contents: write
  


jobs:

  unpack:
  
    runs-on: ubuntu-latest
    
    steps:
    
      - uses: actions/checkout@v4
      
      - name: Unpack verified source
      
        run: |
        
          unzip -o algocracy-source.zip
          
          rm -f algocracy-source.zip .github/workflows/bootstrap.yml
          
      - name: Commit project files
      
        run: |
        
          git config user.name github-actions[bot]
          
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          
          git add -A
          
          git diff --cached --quiet || git commit -m 'Add verified marketing dashboard source'
          
          git push
          





















